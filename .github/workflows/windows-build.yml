name: Windows release build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Build from the Windows batch
        shell: pwsh
        run: |
          $env:TIMEBREAKER_PYTHON = (Get-Command python).Source
          & cmd /c build_exe_windows.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TimeBreakerPCBridge-Windows-x64
          path: release/*
          if-no-files-found: error
      - name: Upload diagnostic build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-evidence
          path: build/evidence/*
          if-no-files-found: ignore
